name: tests

on:
  push:
  pull_request: null

jobs:
  tests:
    name: tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        pyver: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        compiler: [gcc]
        include:
            # no python 3.9 builds exist for the current ubuntu-latest
            - os: ubuntu-24.04
              pyver: "3.9"
              compiler: gcc
            - os: macos-latest
              pyver: "3.9"
              compiler: clang
            - os: macos-latest
              pyver: "3.10"
              compiler: clang
            - os: macos-latest
              pyver: "3.11"
              compiler: clang
            - os: macos-latest
              pyver: "3.12"
              compiler: clang
            - os: macos-latest
              pyver: "3.13"
              compiler: clang
            - os: macos-latest
              pyver: "3.14"
              compiler: clang

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.pyver }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.pyver }}

      - name: Install code
        env:
            CC: ${{ matrix.compiler }}
        run: pip install -e .

      - name: lint
        run: |
          pip install flake8
          flake8 esutil tests

      - name: test
        run: |
          pip install pytest
          pytest -vv tests
